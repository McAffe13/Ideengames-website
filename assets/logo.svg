<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Hintergrund (optional) -->
  <rect width="200" height="200" rx="20" fill="none"/>
  
  <!-- IdeenGames Logo -->
  <g>
    <!-- "I" -->
    <rect x="20" y="20" width="15" height="60" rx="3" fill="#7C4DFF"/>
    <rect x="20" y="80" width="15" height="15" rx="3" fill="#7C4DFF"/>
    
    <!-- "deen" -->
    <text x="45" y="60" font-family="Poppins, sans-serif" font-size="40" font-weight="600" fill="#7C4DFF">deen</text>
    
    <!-- "Games" -->
    <text x="20" y="120" font-family="Poppins, sans-serif" font-size="40" font-weight="700" fill="#38BDF8">Games</text>
    
    <!-- Dekorative Elemente -->
    <circle cx="150" cy="50" r="8" fill="#7C4DFF" opacity="0.7"/>
    <circle cx="170" cy="70" r="6" fill="#38BDF8" opacity="0.7"/>
    <circle cx="140" cy="90" r="5" fill="#FFFFFF" opacity="0.7"/>
    
    <!-- Minecraft-Block-Effekt (optional) -->
    <rect x="160" y="110" width="15" height="15" rx="2" fill="#7C4DFF"/>
    <rect x="160" y="125" width="15" height="15" rx="2" fill="#38BDF8"/>
    <rect x="175" y="110" width="15" height="15" rx="2" fill="#38BDF8"/>
    <rect x="175" y="125" width="15" height="15" rx="2" fill="#7C4DFF"/>
  </g>
  
  <!-- Glow-Effekt -->
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="10" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
</svg>
