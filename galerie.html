<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Galerie – IdeenGames. Entdecke unsere Minigames-Maps!">
    <title>Galerie – IdeenGames</title>
    
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        /* Dynamische Galerie-Stile */
        .galerie-dynamic {
            padding: var(--section-padding);
        }
        
        .galerie-controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        
        .galerie-upload {
            background: var(--glass-bg);
            border: 2px dashed var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition-normal);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
        }
        
        .galerie-upload:hover {
            border-color: var(--accent-purple);
            background: rgba(124, 77, 255, 0.1);
            transform: scale(1.02);
        }
        
        .galerie-upload i {
            font-size: 3rem;
            color: var(--accent-purple);
            margin-bottom: 1rem;
        }
        
        .galerie-upload p {
            color: var(--text-secondary);
        }
        
        .galerie-upload input {
            display: none;
        }
        
        .galerie-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        
        .galerie-preview-item {
            position: relative;
            border-radius: var(--radius-lg);
            overflow: hidden;
            aspect-ratio: 16 / 9;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
        }
        
        .galerie-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .galerie-preview-item .remove-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            width: 30px;
            height: 30px;
            background: rgba(231, 76, 60, 0.9);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .galerie-preview-item .remove-btn:hover {
            background: rgba(231, 76, 60, 1);
            transform: scale(1.1);
        }
        
        .galerie-preview-item .caption-input {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 0.5rem;
            background: rgba(0, 0, 0, 0.7);
            border: none;
            color: white;
            font-size: 0.875rem;
            text-align: center;
        }
        
        .galerie-preview-item .caption-input:focus {
            outline: 2px solid var(--accent-purple);
        }
        
        .save-btn {
            background: var(--accent-purple);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-normal);
        }
        
        .save-btn:hover {
            background: var(--accent-cyan);
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(124, 77, 255, 0.5);
        }
        
        .empty-message {
            text-align: center;
            color: var(--text-tertiary);
            font-size: 1.2rem;
            padding: 3rem;
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-background">
        <div class="bg-layer layer-1"></div>
        <div class="bg-layer layer-2"></div>
        <div class="bg-layer layer-3"></div>
        <div class="neon-grid"></div>
        <div class="scanlines"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">
                <img src="assets/logo.png" alt="IdeenGames Logo" class="logo">
                <span class="logo-text">IdeenGames</span>
            </a>
            
            <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Menü öffnen">
                <span class="hamburger"></span>
            </button>
            
            <ul class="navbar-links" id="navbarLinks">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="galerie.html" class="nav-link active">Galerie</a></li>
                <li><a href="index.html#faq" class="nav-link">FAQ</a></li>
                <li><a href="index.html#discord" class="nav-link">Discord</a></li>
                <li><a href="impressum.html" class="nav-link">Impressum</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="galerie-dynamic">
        <div class="container">
            <h1 class="section-title" style="margin-bottom: 2rem;">Galerie</h1>
            
            <div class="galerie-controls">
                <label class="galerie-upload">
                    <i>📷</i>
                    <p>Bilder hochladen</p>
                    <input type="file" id="imageUpload" accept="image/*" multiple>
                </label>
                <button class="save-btn" id="saveGallery">Galerie speichern</button>
            </div>
            
            <div class="galerie-preview" id="imagePreview">
                <p class="empty-message">Lade Bilder hoch, um sie hier anzuzeigen.</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">
                    <img src="assets/logo.png" alt="IdeenGames Logo" class="logo">
                    <span class="logo-text">IdeenGames</span>
                </div>
                <div class="footer-links">
                    <a href="index.html">Home</a>
                    <a href="galerie.html">Galerie</a>
                    <a href="impressum.html">Impressum</a>
                    <a href="datenschutz.html">Datenschutz</a>
                    <a href="https://discord.gg/sVFsuaKJCG" target="_blank" rel="noopener noreferrer">Discord</a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2025 IdeenGames. Alle Rechte vorbehalten.</p>
            </div>
        </div>
    </footer>

    <!-- Back to Top Button -->
    <button class="back-to-top" id="backToTop" aria-label="Nach oben">↑</button>

    <script src="js/script.js"></script>
    <script>
        // Dynamische Galerie-Funktionen
        const imageUpload = document.getElementById('imageUpload');
        const imagePreview = document.getElementById('imagePreview');
        const saveGallery = document.getElementById('saveGallery');
        
        let images = [];
        
        // Bilder Vorschau
        imageUpload.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            images = [...images, ...files];
            updatePreview();
            e.target.value = '';
        });
        
        // Vorschau aktualisieren
        function updatePreview() {
            if (images.length === 0) {
                imagePreview.innerHTML = '<p class="empty-message">Lade Bilder hoch, um sie hier anzuzeigen.</p>';
                return;
            }
            
            imagePreview.innerHTML = '';
            images.forEach((img, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const previewItem = document.createElement('div');
                    previewItem.className = 'galerie-preview-item';
                    previewItem.innerHTML = `
                        <img src="${e.target.result}" alt="Bild ${index + 1}">
                        <button class="remove-btn" data-index="${index}">✕</button>
                        <input type="text" class="caption-input" placeholder="Bildbeschreibung..." data-index="${index}">
                    `;
                    imagePreview.appendChild(previewItem);
                    
                    // Remove-Button
                    previewItem.querySelector('.remove-btn').addEventListener('click', () => {
                        images.splice(index, 1);
                        updatePreview();
                    });
                };
                reader.readAsDataURL(img);
            });
        }
        
        // Speichern (LocalStorage)
        saveGallery.addEventListener('click', () => {
            const captions = Array.from(imagePreview.querySelectorAll('.caption-input')).map(input => input.value);
            const galleryData = images.map((img, i) => ({
                file: img.name,
                caption: captions[i] || ''
            }));
            
            localStorage.setItem('ideengames-gallery', JSON.stringify(galleryData));
            alert('Galerie wurde lokal gespeichert! (Noch nicht online)');
        });
        
        // Beim Laden prüfen, ob Bilder vorhanden sind
        window.addEventListener('load', () => {
            const savedGallery = localStorage.getItem('ideengames-gallery');
            if (savedGallery) {
                // Hier könnte man gespeicherte Bilder laden (für Demo nur Hinweis)
                console.log('Gespeicherte Galerie gefunden:', JSON.parse(savedGallery));
            }
        });
    </script>
</body>
</html>
